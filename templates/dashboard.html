{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">JEPMS Dashboard</h2>

<div class="row g-4">

  <div class="col-md-4">
    <div class="card shadow-sm text-center h-100">
      <div class="card-body">
        <h5 class="card-title">Employers</h5>
        <h2 class="text-primary">{{ employer_count }}</h2>

        <a href="{% url 'employer_list' %}" class="btn btn-primary">
          View Employers
        </a>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card shadow-sm text-center h-100">
      <div class="card-body">
        <h5 class="card-title">Vacancies</h5>
        <h2 class="text-success">{{ vacancy_count }}</h2>

        <a href="{% url 'vacancy_list' %}" class="btn btn-success">
          View Vacancies
        </a>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card shadow-sm text-center h-100">
      <div class="card-body">
        <h5 class="card-title">Job Applications</h5>
        <h2 class="text-warning">{{ application_count }}</h2>

        <a href="{% url 'application_list' %}" class="btn btn-warning">
          View Applications
        </a>
      </div>
    </div>
  </div>

</div>

{% endblock %}

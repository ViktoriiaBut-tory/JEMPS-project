{% extends "base.html" %}
{% block content %}

<div class="card shadow-sm">
  <div class="card-header">
    <h2 class="mb-0">Delete Application</h2>
  </div>

  <div class="card-body">
    <p>
      Are you sure you want to delete the application for
      <strong>{{ object.learner_name }}</strong>?
    </p>

    <form method="post">
      {% csrf_token %}

      <button type="submit" class="btn btn-danger">
        Yes, Delete
      </button>

      <a href="{% url 'application_list' %}" class="btn btn-secondary">
        Cancel
      </a>
    </form>
  </div>
</div>

{% endblock %}

{% extends "base.html" %}
{% block content %}

<div class="card shadow-sm">
  <div class="card-header">
    <h2 class="mb-0">
      {% if object %}
        Edit Application
      {% else %}
        Add Application
      {% endif %}
    </h2>
  </div>

  <div class="card-body">
   <form method="post" novalidate>
      {% csrf_token %}

      {{ form.as_p }}

      <button type="submit" class="btn btn-primary">
        Save
      </button>

      <a href="{% url 'application_list' %}" class="btn btn-secondary">
        Cancel
      </a>
    </form>
  </div>
</div>

{% endblock %}
